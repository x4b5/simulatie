<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bijna geraakt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body data-phase="loading">
<canvas id="scene" aria-label="3D-magazijn"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="topbar">
  <div class="tb-left">
    <div class="tb-badge"><span class="tape" aria-hidden="true"></span><span data-t="exercise">Oefening</span></div>
    <button id="skip" class="skip" type="button" hidden data-t="skip"><span class="t-nl">Naar de keuze</span><span class="t-tr"></span></button>
  </div>
  <div class="tb-tools">
    <label class="tb-lang">
      <span class="sr-only">Vertaling</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9M8.5 3v2m3.5 0c-.8 4.4-3.7 8-7.5 9.6M6.5 9c1.2 2.4 3.3 4.4 6 5.5M13 21l4-10 4 10m-6.8-3.5h5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <select class="lang" id="lang-top"></select>
    </label>
    <button class="icon-btn" id="tb-mute" type="button" aria-pressed="false" title="Geluid aan/uit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-on" d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path class="i-off" d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6m0-6-5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="sr-only">Geluid aan/uit</span>
    </button>
    <button class="icon-btn" id="tb-fs" type="button" title="Volledig scherm">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="sr-only">Volledig scherm</span>
    </button>
    <button class="icon-btn" id="tb-restart" type="button" title="Opnieuw vanaf het begin">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="sr-only">Opnieuw vanaf het begin</span>
    </button>
  </div>
</header>

<section id="start" class="start" aria-labelledby="start-title">
  <div class="start-card">
    <div class="hazard" aria-hidden="true"></div>
    <p class="eyebrow" data-t="eyebrow"><span class="t-nl"></span><span class="t-tr"></span></p>
    <h1 id="start-title" data-t="title"><span class="t-nl">Bijna geraakt</span><span class="t-tr"></span></h1>
    <div class="setting" data-t="setting"><p class="t-nl"></p><p class="t-tr"></p></div>
    <div class="note" data-t="note">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 20h19zM12 10v4.5M12 17.2v.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><p class="t-nl"></p><p class="t-tr"></p></div>
    </div>
    <div class="start-controls">
      <label class="field">
        <span data-t="lang"><span class="t-nl">Vertaling</span></span>
        <select class="lang" id="lang-start"></select>
      </label>
      <div class="start-buttons">
        <button id="btn-start" class="btn primary is-loading" type="button" disabled>
          <span data-t="start"><span class="t-nl">Start de oefening</span><span class="t-tr"></span></span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <button id="btn-vr" class="btn ghost" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h15A1.5 1.5 0 0 1 21 8.5v7a1.5 1.5 0 0 1-1.5 1.5h-4l-2-3h-3l-2 3h-4A1.5 1.5 0 0 1 3 15.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="11.5" r="1.6" fill="currentColor"/><circle cx="16" cy="11.5" r="1.6" fill="currentColor"/></svg>
          <span data-t="vr"><span class="t-nl">Bekijk in VR</span><span class="t-tr"></span></span>
        </button>
      </div>
      <p class="vr-note" id="vr-note" data-t="noVr" hidden><span class="t-nl"></span><span class="t-tr"></span></p>
      <p class="sound" data-t="sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="t-nl"></span><span class="t-tr"></span>
      </p>
    </div>
  </div>
</section>

<aside id="hud" class="hud" hidden aria-hidden="true">
  <div class="hud-screen">
    <div class="hud-row"><span>ORDER</span><b>4471</b></div>
    <div class="hud-dest">→ DOCK 3</div>
    <div class="hud-row"><span>TRUCK VERTREKT</span><b class="hud-time">03:58</b></div>
    <div class="hud-bar"><i></i></div>
  </div>
  <div class="hud-keys"><i></i><i></i><i></i></div>
</aside>

<div id="hint" class="hint" hidden data-t="drag"><span class="t-nl"></span></div>

<div id="subs" class="subs" hidden aria-live="polite">
  <span class="who"></span>
  <p class="nl"></p>
  <p class="tr"></p>
</div>

<section id="choice" class="choice" hidden aria-labelledby="c-title">
  <header class="c-head">
    <h2 id="c-title" class="c-title">Wat zeg jij?</h2>
    <p class="c-title-tr"></p>
    <p class="c-sub"></p>
    <p class="c-sub-tr"></p>
  </header>
  <div class="c-list"></div>
  <p class="c-keys">1 · 2 · 3</p>
</section>

<section id="reflect" class="reflect" hidden aria-labelledby="r-title" data-mood="calm">
  <div class="r-strip" aria-hidden="true"></div>
  <div class="r-inner">
    <p class="r-mood"></p><p class="r-mood-tr"></p>
    <h2 id="r-title" class="r-title"></h2><p class="r-title-tr"></p>
    <p class="r-choice"></p>
    <div class="r-sec">
      <h3 class="r-what-h"></h3><p class="r-what-h-tr"></p>
      <p class="r-what"></p><p class="r-what-tr"></p>
    </div>
    <div class="r-sec">
      <h3 class="r-why-h"></h3><p class="r-why-h-tr"></p>
      <p class="r-why"></p><p class="r-why-tr"></p>
    </div>
    <div class="r-sec r-tipbox">
      <h3 class="r-tip-h"></h3><p class="r-tip-h-tr"></p>
      <p class="r-tip"></p><p class="r-tip-tr"></p>
    </div>
    <div class="r-sec r-qbox">
      <h3 class="r-q-h"></h3><p class="r-q-h-tr"></p>
      <p class="r-q"></p><p class="r-q-tr"></p>
    </div>
    <div class="r-all" hidden><p class="r-all-nl"></p><p class="r-all-tr"></p></div>
  </div>
  <div class="r-actions">
    <button id="btn-retry" class="btn primary" type="button"><span class="b-nl"></span><span class="b-tr"></span></button>
    <button id="btn-restart" class="btn ghost" type="button"><span class="b-nl"></span><span class="b-tr"></span></button>
  </div>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
